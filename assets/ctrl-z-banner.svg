<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Ctrl+Z  Undo for your whole project">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2a2e"/>
      <stop offset="55%" stop-color="#0f3d42"/>
      <stop offset="100%" stop-color="#082226"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132a2e"/>
      <stop offset="100%" stop-color="#0c1c1f"/>
    </linearGradient>
  </defs>

  <!-- Banner only  no badges, no awards -->
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>

  <!-- subtle circuit lines (right) -->
  <g stroke="#1f5a5f" stroke-width="1.5" fill="none" opacity="0.45">
    <path d="M720 80 H1180"/>
    <path d="M760 140 H1120"/>
    <path d="M700 220 H1200"/>
    <path d="M780 300 H1140"/>
    <path d="M740 380 H1180"/>
    <path d="M800 460 H1100"/>
    <path d="M720 540 H1160"/>
    <path d="M980 60 V580"/>
    <path d="M1080 100 V520"/>
    <circle cx="980" cy="220" r="4" fill="#2a7a80" stroke="none"/>
    <circle cx="1080" cy="300" r="4" fill="#2a7a80" stroke="none"/>
    <circle cx="980" cy="380" r="4" fill="#2a7a80" stroke="none"/>
  </g>

  <!-- Title -->
  <text x="72" y="170" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700">Ctrl+Z</text>
  <text x="72" y="230" fill="#d7eef0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="500">Undo for your whole project.</text>

  <!-- Terminal card -->
  <rect x="72" y="290" width="420" height="150" rx="14" fill="url(#card)" stroke="#2a555a"/>
  <circle cx="100" cy="318" r="6" fill="#ff5f57"/>
  <circle cx="122" cy="318" r="6" fill="#febc2e"/>
  <circle cx="144" cy="318" r="6" fill="#28c840"/>
  <text x="96" y="370" fill="#3dd68c" font-family="Consolas, Menlo, monospace" font-size="28">&gt; /undo</text>
  <text x="96" y="410" fill="#e8f4f5" font-family="Consolas, Menlo, monospace" font-size="22">restore success</text>

  <!-- Undo arrow -->
  <g transform="translate(920,200)" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 40 A90 90 0 1 1 40 160"/>
    <path d="M120 40 L70 10"/>
    <path d="M120 40 L150 85"/>
  </g>

  <!-- Document stack -->
  <g transform="translate(1040,360)">
    <rect x="0" y="20" width="90" height="110" rx="8" fill="#d9eef0" opacity="0.35"/>
    <rect x="16" y="10" width="90" height="110" rx="8" fill="#eaf7f8" opacity="0.55"/>
    <rect x="32" y="0" width="90" height="110" rx="8" fill="#ffffff"/>
    <rect x="48" y="28" width="58" height="8" rx="4" fill="#0f3d42" opacity="0.35"/>
    <rect x="48" y="48" width="48" height="8" rx="4" fill="#0f3d42" opacity="0.25"/>
    <rect x="48" y="68" width="54" height="8" rx="4" fill="#0f3d42" opacity="0.25"/>
  </g>
</svg>
